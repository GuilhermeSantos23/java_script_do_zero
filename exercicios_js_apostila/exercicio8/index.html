        .destaque{
            background-color: black;

<body>
    <h1 style="text-align: center;"> Olá, mundo</h1>

    <button id="meuBotao"> Aperte aqui</button>

    <script>
        //1. Altere o texto de um elemento h1 via JavaScript. 
        //2. Mude a cor de fundo de um parágrafo ao carregar a página. 
        //3. Adicione uma classe CSS a um botão existente. 
        let titulo = document.querySelector("h1"); 
        titulo.textContent="Atividade 8";

        window.onload = function() {
        let paragrafo = document.querySelector("p");

        paragrafo.style.backgroundColor = "red";
        };

        const botao = document.getElementById("meuBotao");
        botao.classList.add("destaque");


    </script>
